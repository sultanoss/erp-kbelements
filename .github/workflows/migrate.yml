name: Supabase Migration

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Run migrations via direct connection
        run: |
          PROJECT_REF="ahrubmkkotkqmxvikjml"
          POOLER_HOST="aws-0-eu-central-1.pooler.supabase.com"

          run_migrations() {
            local CONN="$1"
            for SQL_FILE in supabase/migrations/*.sql; do
              echo "Running $SQL_FILE..."
              if ! PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" psql "$CONN" -f "$SQL_FILE" --set ON_ERROR_STOP=1 2>&1; then
                echo "Fehler bei $SQL_FILE"
                return 1
              fi
            done
            return 0
          }

          echo "Trying pooler port 6543..."
          if run_migrations "postgresql://postgres.${PROJECT_REF}@${POOLER_HOST}:6543/postgres?sslmode=require"; then
            echo "Alle Migrationen erfolgreich!"
            exit 0
          fi

          echo "Trying pooler port 5432..."
          if run_migrations "postgresql://postgres.${PROJECT_REF}@${POOLER_HOST}:5432/postgres?sslmode=require"; then
            echo "Alle Migrationen erfolgreich!"
            exit 0
          fi

          echo "Alle Verbindungsversuche fehlgeschlagen."
          exit 1
